<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ChildMaltreatment-Bench workflow</title>
  <desc id="desc">A response is submitted, automatically assessed, reviewed for strengths and gaps, and revised for practice.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f6f9ff"/>
      <stop offset="1" stop-color="#eefaf7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#183b56" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5f7790"/>
    </marker>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text x="600" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17324d">From response to better practice</text>
  <text x="600" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#526b80">Automated, structured feedback grounded in the WHO LIVES CC framework</text>

  <g filter="url(#shadow)">
    <rect x="65" y="125" width="220" height="145" rx="18" fill="#ffffff"/>
    <rect x="345" y="125" width="220" height="145" rx="18" fill="#ffffff"/>
    <rect x="625" y="125" width="220" height="145" rx="18" fill="#ffffff"/>
    <rect x="905" y="125" width="220" height="145" rx="18" fill="#ffffff"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="175" cy="163" r="22" fill="#dce9ff"/><text x="175" y="171" font-size="22" fill="#2456a6">1</text>
    <text x="175" y="213" font-size="20" font-weight="700" fill="#17324d">Submit</text>
    <text x="175" y="239" font-size="14" fill="#526b80">AI or practice response</text>
    <text x="175" y="260" font-size="14" fill="#526b80">CSV / XLSX</text>

    <circle cx="455" cy="163" r="22" fill="#dff5ed"/><text x="455" y="171" font-size="22" fill="#177558">2</text>
    <text x="455" y="213" font-size="20" font-weight="700" fill="#17324d">Assess</text>
    <text x="455" y="239" font-size="14" fill="#526b80">Automated rubric scoring</text>
    <text x="455" y="260" font-size="14" fill="#526b80">Consistent feedback</text>

    <circle cx="735" cy="163" r="22" fill="#fff0d6"/><text x="735" y="171" font-size="22" fill="#a35b00">3</text>
    <text x="735" y="213" font-size="20" font-weight="700" fill="#17324d">Reflect</text>
    <text x="735" y="239" font-size="14" fill="#526b80">Find strengths and gaps</text>
    <text x="735" y="260" font-size="14" fill="#526b80">Plan the next response</text>

    <circle cx="1015" cy="163" r="22" fill="#f0e5ff"/><text x="1015" y="171" font-size="22" fill="#7041a6">4</text>
    <text x="1015" y="213" font-size="20" font-weight="700" fill="#17324d">Improve</text>
    <text x="1015" y="239" font-size="14" fill="#526b80">Revise and resubmit</text>
    <text x="1015" y="260" font-size="14" fill="#526b80">Build safer practice</text>
  </g>

  <path d="M292 197 H335" stroke="#5f7790" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M572 197 H615" stroke="#5f7790" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M852 197 H895" stroke="#5f7790" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
